[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-delivery-bottleneck-analyzer"
version = "0.1.0"
description = "Context-aware pull-request review bottleneck analyzer companion for Apache DevLake"
readme = "../README.md"
authors = [{ name = "Engineering Delivery Bottleneck Analyzer Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
