# ==============================================================================
# Engineering Delivery Bottleneck Analyzer: Unified Local Development Compose
# Includes Apache DevLake v1.0.2 + Bottleneck Analyzer Companion
# ==============================================================================

version: '3.8'

networks:
  devlake-net:
    driver: bridge

volumes:
  devlake-mysql:
  devlake-grafana:
  analyzer-data:

services:
  # ----------------------------------------------------------------------------
  # Apache DevLake v1.0.2 Services
  # ----------------------------------------------------------------------------
  devlake-db:
    image: mysql:8.0
    container_name: devlake-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lake}
      MYSQL_USER: ${MYSQL_USER:-merico}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merico}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M
    volumes:
      - devlake-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - devlake-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  devlake-be:
    image: apache/devlake:v1.0.2
    container_name: devlake-be
    restart: always
    environment:
      DB_URL: mysql://${MYSQL_USER:-merico}:${MYSQL_PASSWORD:-merico}@devlake-db:3306/${MYSQL_DATABASE:-lake}?charset=utf8mb4&parseTime=True
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-AhG76xKpLm92QvBn54TrZc10WsEdYfUi}
      PORT: "8080"
      LOGGING_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      devlake-db:
        condition: service_healthy
    networks:
      - devlake-net

  devlake-config-ui:
    image: apache/devlake-config-ui:v1.0.2
    container_name: devlake-config-ui
    restart: always
    environment:
      DEVLAKE_ENDPOINT: http://devlake-be:8080
      GRAFANA_ENDPOINT: http://devlake-grafana:3000
    ports:
      - "4000:4000"
    depends_on:
      - devlake-be
    networks:
      - devlake-net

  devlake-grafana:
    image: apache/devlake-dashboard:v1.0.2
    container_name: devlake-grafana
    restart: always
    environment:
      MYSQL_HOST: devlake-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lake}
      MYSQL_USER: ${MYSQL_USER:-merico}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merico}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3002:3000"
    volumes:
      - devlake-grafana:/var/lib/grafana
    depends_on:
      devlake-db:
        condition: service_healthy
    networks:
      - devlake-net

  # ----------------------------------------------------------------------------
  # Bottleneck Analyzer Companion Services
  # ----------------------------------------------------------------------------
  analyzer-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bottleneck-analyzer-backend
    restart: unless-stopped
    environment:
      DEVLAKE_DB_URL: mysql+pymysql://${MYSQL_USER:-merico}:${MYSQL_PASSWORD:-merico}@devlake-db:3306/${MYSQL_DATABASE:-lake}?charset=utf8mb4
      APP_DB_URL: sqlite:////app/data/app_state.db
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      WORK_DAYS: ${WORK_DAYS:-0,1,2,3,4}
      WORK_START_TIME: ${WORK_START_TIME:-09:30}
      WORK_END_TIME: ${WORK_END_TIME:-18:30}
      REVIEW_SLA_HOURS: ${REVIEW_SLA_HOURS:-8.0}
      HOLIDAYS_JSON: ${HOLIDAYS_JSON:-["2026-01-01","2026-01-26","2026-08-15","2026-10-02","2026-12-25"]}
      EXCLUDE_BOTS: ${EXCLUDE_BOTS:-true}
      INCLUDE_NORMAL_COMMENTS_AS_REVIEW: ${INCLUDE_NORMAL_COMMENTS_AS_REVIEW:-false}
      MIN_HISTORICAL_SAMPLE_SIZE: ${MIN_HISTORICAL_SAMPLE_SIZE:-10}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_DRY_RUN: ${ALERT_DRY_RUN:-true}
      ALERT_COOLDOWN_HOURS: ${ALERT_COOLDOWN_HOURS:-24}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-30}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - analyzer-data:/app/data
    depends_on:
      devlake-db:
        condition: service_healthy
    networks:
      - devlake-net

  analyzer-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bottleneck-analyzer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - analyzer-backend
    networks:
      - devlake-net
