# ==============================================================================
# Apache DevLake v1.0.2 Official Deployment Configuration
# Pinned Release: v1.0.2 (Compatible with v1.0.0 and v1.0.1)
# Documentation: https://devlake.apache.org/docs/GettingStarted/DockerComposeSetup/
# ==============================================================================

version: '3.8'

networks:
  devlake-net:
    driver: bridge

volumes:
  devlake-mysql:
  devlake-grafana:

services:
  devlake-db:
    image: mysql:8.0
    container_name: devlake-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lake}
      MYSQL_USER: ${MYSQL_USER:-merico}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merico}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M
    volumes:
      - devlake-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - devlake-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  devlake-be:
    image: apache/devlake:v1.0.2
    container_name: devlake-be
    restart: always
    environment:
      DB_URL: mysql://${MYSQL_USER:-merico}:${MYSQL_PASSWORD:-merico}@devlake-db:3306/${MYSQL_DATABASE:-lake}?charset=utf8mb4&parseTime=True
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-AhG76xKpLm92QvBn54TrZc10WsEdYfUi}
      PORT: "8080"
      LOGGING_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      devlake-db:
        condition: service_healthy
    networks:
      - devlake-net

  devlake-config-ui:
    image: apache/devlake-config-ui:v1.0.2
    container_name: devlake-config-ui
    restart: always
    environment:
      DEVLAKE_ENDPOINT: http://devlake-be:8080
      GRAFANA_ENDPOINT: http://devlake-grafana:3000
    ports:
      - "4000:4000"
    depends_on:
      - devlake-be
    networks:
      - devlake-net

  devlake-grafana:
    image: apache/devlake-dashboard:v1.0.2
    container_name: devlake-grafana
    restart: always
    environment:
      MYSQL_HOST: devlake-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lake}
      MYSQL_USER: ${MYSQL_USER:-merico}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merico}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3002:3000"
    volumes:
      - devlake-grafana:/var/lib/grafana
    depends_on:
      devlake-db:
        condition: service_healthy
    networks:
      - devlake-net
